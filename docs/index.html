<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EPT Forum – Dashboard</title>
<meta name="theme-color" content="#cbeeff">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
<div class="press" aria-hidden="true"><div class="bs-plate c"></div><div class="bs-plate m"></div><div class="bs-plate y"></div></div>
<div class="wrap">
<header class="head">
  <div class="brand">
    <div class="logos">
      <img src="assets/ept-logo.png" alt="École Polytechnique de Tunisie">
      <img src="assets/forum-ept-logo.png" alt="Forum EPT Enterprises, 24e édition">
    </div>
    <div style="flex:1;min-width:240px">
      <div class="kicker">24ᵉ édition · Inscriptions</div>
      <h1>EPT Forum Enterprises 2026</h1>
    </div>
  </div>
  <div class="rule-thick"></div><div class="rule-thin"></div>
  <nav class="navbar">
    <span class="status" id="status">Dashboard</span>
    <a class="btn btn-ghost" href="scan.html">Scanner</a>
    <button class="btn btn-ghost" id="export">Export CSV</button>
    <button class="btn btn-ghost" id="refresh">Rafraîchir</button>
    <button class="btn btn-ghost" id="logout">Déconnexion</button>
  </nav>
</header>

<main>
  <section class="stats">
    <div><div class="num" id="s-total">–</div><div class="lbl">Inscrits</div></div>
    <div>
      <div class="num-box"><div class="cmyk-num">
        <span class="paper sin">–</span>
        <span class="plate plate-c sin" aria-hidden="true">–</span>
        <span class="plate plate-m sin" aria-hidden="true">–</span>
        <span class="plate plate-y sin" aria-hidden="true">–</span>
      </div></div>
      <div class="lbl">Présents</div>
    </div>
    <div><div class="num"><span id="s-rate">–</span><small> %</small></div><div class="lbl">Taux de présence</div></div>
    <div><div class="num"><span id="s-wsy">–</span><small style="color:var(--color-neutral-600)"> / <span id="s-wsn">–</span></small></div><div class="lbl">Atelier : oui / non</div></div>
  </section>

  <section class="panels">
    <div><h4>Par profession</h4><div id="p-prof"></div></div>
    <div><h4>Top écoles</h4><div id="p-school"></div></div>
  </section>

  <section class="list">
    <h3>Inscrits</h3>
    <div class="filters">
      <input class="input" type="search" id="q" placeholder="Rechercher (nom, email, école, code…)">
      <select class="input" id="f-prof"><option value="">Profession</option></select>
      <select class="input" id="f-ws"><option value="">Atelier</option><option>Yes</option><option>No</option></select>
      <select class="input" id="f-in"><option value="">Présence</option><option value="1">Présents</option><option value="0">Absents</option></select>
      <select class="input" id="f-school"><option value="">École</option></select>
    </div>
    <div class="count" id="count"></div>
    <div class="tablewrap">
      <table class="table"><thead><tr id="thead"></tr></thead><tbody id="tbody"></tbody></table>
    </div>
  </section>
</main>
</div>
</div>

<div id="login" class="dialog-backdrop" hidden>
  <form id="login-form" class="dialog">
    <div class="logos">
      <img src="assets/ept-logo.png" alt="EPT" style="height:52px">
      <img src="assets/forum-ept-logo.png" alt="Forum EPT" style="height:52px;width:52px">
    </div>
    <h2 style="margin:0">EPT Forum – Accès</h2>
    <div class="field"><label>URL de l'API (Apps Script /exec)</label><input class="input" id="login-url" type="url" placeholder="https://script.google.com/macros/s/…/exec"></div>
    <div class="field"><label>Token</label><input class="input" id="login-token" type="password" required autocomplete="current-password"></div>
    <button class="btn btn-primary" type="submit">Se connecter</button>
    <p id="login-msg"></p>
  </form>
</div>

<script src="shared.js"></script>
<script>
(function () {
  var COLS = [
    ["checked_in", "Présence"], ["last_name", "Nom"], ["first_name", "Prénom"], ["email", "Email"],
    ["phone", "Téléphone"], ["profession", "Profession"], ["school", "École"],
    ["organisation", "Organisation"], ["workshop", "Atelier"], ["checked_in_at", "Check-in"],
    ["created_at", "Inscrit le"], ["code", "Code"]
  ];
  var items = [], sortKey = "created_at", sortDir = -1, updated = "";
  var $ = function (id) { return document.getElementById(id); };

  $("thead").innerHTML = COLS.map(function (c) { return '<th data-k="' + c[0] + '">' + c[1] + '<span></span></th>'; }).join("");
  $("thead").onclick = function (e) {
    var th = e.target.closest("th"); if (!th) return;
    var k = th.dataset.k;
    if (sortKey === k) sortDir = -sortDir; else { sortKey = k; sortDir = 1; }
    render();
  };
  ["q", "f-prof", "f-ws", "f-in", "f-school"].forEach(function (id) { $(id).oninput = render; });
  $("refresh").onclick = load;
  $("logout").onclick = function () { EPT.logout(); location.reload(); };
  $("export").onclick = exportCsv;

  function setStatus(t) { $("status").textContent = "Dashboard — " + t; }

  function load() {
    setStatus("chargement…");
    Promise.all([EPT.get({ action: "list" }), EPT.get({ action: "stats" })]).then(function (r) {
      items = r[0].items;
      renderStats(r[1].stats);
      fillOptions();
      render();
      setStatus("mis à jour à " + new Date().toLocaleTimeString("fr-FR") + " (auto toutes les 30 s)");
    }).catch(function (e) {
      if (e.code === "unauthorized") { EPT.logout(); location.reload(); return; }
      setStatus("erreur de chargement : " + e.message);
    });
  }

  function bars(el, obj, total, limit) {
    var rows = Object.keys(obj).sort(function (a, b) { return obj[b] - obj[a]; }).slice(0, limit || 99);
    el.innerHTML = rows.map(function (k) {
      var pct = total ? Math.round(obj[k] / total * 100) : 0;
      return '<div class="bar"><span class="name" title="' + EPT.esc(k) + '">' + EPT.esc(k) + '</span>' +
        '<span class="track"><span class="fill" style="width:' + pct + '%"></span></span>' +
        '<span class="val">' + obj[k] + ' · ' + pct + '%</span></div>';
    }).join("") || '<div class="empty">Aucune donnée</div>';
  }

  function renderStats(s) {
    $("s-total").textContent = s.total;
    document.querySelectorAll(".sin").forEach(function (el) { el.textContent = s.checked_in; });
    $("s-rate").textContent = s.rate;
    $("s-wsy").textContent = s.workshop.Yes;
    $("s-wsn").textContent = s.workshop.No;
    bars($("p-prof"), s.by_profession, s.total);
    bars($("p-school"), s.by_school, s.total, 8);
  }

  function fillOptions() {
    [["f-prof", "profession"], ["f-school", "school"]].forEach(function (p) {
      var sel = $(p[0]), cur = sel.value, first = sel.options[0].outerHTML;
      var vals = Array.from(new Set(items.map(function (o) { return o[p[1]]; }).filter(Boolean))).sort();
      sel.innerHTML = first + vals.map(function (v) { return '<option>' + EPT.esc(v) + '</option>'; }).join("");
      sel.value = cur;
    });
  }

  function filtered() {
    var q = $("q").value.trim().toLowerCase();
    var fp = $("f-prof").value, fw = $("f-ws").value, fi = $("f-in").value, fs = $("f-school").value;
    return items.filter(function (o) {
      if (fp && o.profession !== fp) return false;
      if (fw && o.workshop !== fw) return false;
      if (fs && o.school !== fs) return false;
      if (fi && (fi === "1") !== o.checked_in) return false;
      if (q && ![o.first_name, o.last_name, o.email, o.phone, o.school, o.organisation, o.code]
            .join(" ").toLowerCase().includes(q)) return false;
      return true;
    });
  }

  function render() {
    Array.prototype.forEach.call($("thead").children, function (th) {
      th.lastChild.textContent = th.dataset.k === sortKey ? (sortDir > 0 ? " ↑" : " ↓") : "";
    });
    var rows = filtered().sort(function (a, b) {
      var x = a[sortKey], y = b[sortKey];
      if (typeof x === "boolean") { x = +x; y = +y; }
      return (x > y ? 1 : x < y ? -1 : 0) * sortDir;
    });
    $("tbody").innerHTML = rows.map(function (o) {
      return '<tr>' + COLS.map(function (c) {
        var k = c[0], v = o[k];
        if (k === "checked_in") return '<td><span class="tag ' + (v ? "tag-accent" : "tag-neutral") + '">' + (v ? "Présent" : "Absent") + '</span></td>';
        if (k === "checked_in_at" || k === "created_at") return '<td class="text-muted num-c">' + EPT.esc(EPT.fmtDate(v)) + '</td>';
        if (k === "last_name") return '<td style="font-weight:600">' + EPT.esc(v) + '</td>';
        if (k === "code") return '<td style="font-size:12px;color:var(--color-accent-700)">' + EPT.esc(v) + '</td>';
        return '<td>' + EPT.esc(v) + '</td>';
      }).join("") + '</tr>';
    }).join("");
    $("count").textContent = rows.length + " résultat(s)";
  }

  function exportCsv() {
    var keys = ["code", "created_at", "first_name", "last_name", "email", "phone", "profession", "school",
                "organisation", "workshop", "checked_in", "checked_in_at", "checked_in_by"];
    var cell = function (v) {
      v = String(v == null ? "" : v);
      if (/^[=+\-@]/.test(v)) v = "'" + v;            // neutralise l'injection de formules Excel
      return '"' + v.replace(/"/g, '""') + '"';
    };
    var lines = [keys.join(",")].concat(filtered().map(function (o) {
      return keys.map(function (k) { return cell(o[k]); }).join(",");
    }));
    var blob = new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "inscrits-ept-forum-" + new Date().toISOString().slice(0, 10) + ".csv";
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }

  function start() { load(); setInterval(function () { if (!document.hidden) load(); }, 30000); }
  if (EPT.configured()) start(); else EPT.login(start);
})();
</script>
</body>
</html>
